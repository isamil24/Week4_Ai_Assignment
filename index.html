
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Calculator Display -->
        <div class="display">
            <div id="previous"></div>
            <input type="text" id="display" value="0" readonly>
        </div>

        <!-- Calculator Buttons -->
        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>
            <button class="operator" onclick="deleteNumber()">⌫</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="equal" onclick="calculate()">=</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>

        </div>

        <!-- History Button -->
        <button class="history-toggle" onclick="toggleHistory()">
            Show History
        </button>

        <!-- History Section -->
        <div id="history" class="history" style="display: none;">

            <div class="history-header">
                <h3>Calculation History</h3>
                <button id="clear-history" onclick="clearHistory()">
                    Clear
                </button>
            </div>

            <ul id="history-list"></ul>

        </div>

        <p class="keyboard-info">
            Use your keyboard or click the buttons
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
